name: Dependency Audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run (Mondays 06:00 UTC) to detect new advisories
    # against an otherwise-unchanged lockfile before unrelated work merges.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      # Fails on any high/critical advisory that is not a reviewed, unexpired
      # entry in audit-allowlist.json. See that file for the accepted exceptions.
      - name: Audit root and mobile dependencies
        run: node scripts/audit-gate.mjs

      - name: Test the audit gate
        run: node --test scripts/audit-gate.test.mjs
