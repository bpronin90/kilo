name: Review Disposition

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

# One repository-wide group serializes every evaluation. A running job is never
# canceled; GitHub may replace a queued job with a newer one, which is safe
# because every run reconciles all open PRs (scripts/review-disposition.mjs).
concurrency:
  group: review-disposition
  cancel-in-progress: false

jobs:
  evaluate:
    name: evaluate current head review disposition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted evaluator
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Evaluate and publish review disposition
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-disposition.mjs
