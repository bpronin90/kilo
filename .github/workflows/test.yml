name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Test governance tooling
        run: node --test scripts/review-disposition.test.mjs scripts/changelog-fragments.test.mjs scripts/run-pgtap-suite.test.mjs scripts/security-delivery.test.mjs

      - name: Export target-branch baseline for inflation check
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:scripts/check-app-file-lines.mjs > /tmp/ref-check.mjs
          node --input-type=module --eval "
            import { BASELINE } from '/tmp/ref-check.mjs';
            import { writeFileSync } from 'node:fs';
            writeFileSync('/tmp/ref-baseline.json', JSON.stringify(BASELINE));
          "

      - name: Enforce production file line limit
        run: |
          if [ -f /tmp/ref-baseline.json ]; then
            node scripts/check-app-file-lines.mjs --ref-baseline /tmp/ref-baseline.json
          else
            npm run check:app-lines
          fi

      - name: Test the file line limit guard
        run: node --test scripts/check-app-file-lines.test.mjs

      - run: npm --prefix mobile ci

      - run: npm --prefix mobile test

      - name: Export and serve web smoke build
        run: npm --prefix mobile run smoke:web

  database-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.0

      - name: Start a disposable database and apply every migration
        run: |
          supabase start --exclude edge-runtime,gotrue,imgproxy,kong,logflare,mailpit,postgres-meta,postgrest,realtime,storage-api,studio,supavisor,vector
          supabase db reset --local --no-seed

      - name: Run every pgTAP security test without skips or aborts
        run: node scripts/run-pgtap-suite.mjs

  shared-deno:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run shared Edge Function module tests
        run: >
          deno test --no-check --no-lock --allow-import --allow-read
          supabase/functions/_shared/security-event.test.ts
          supabase/functions/_shared/rate-limit.test.ts
          supabase/functions/_shared/health-data-scope.test.ts
